<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="../src/public/images/favicon.ico" />
    <link rel="icon" type="image/x-icon" href="../src/public/images/favicon.ico" />
    <link href="../src/public/css/reset.css" rel="stylesheet">
    <link href="../src/public/css/signup.css" rel="stylesheet">
    <title>Créer un compte administrateur</title>
</head>
<body>
    <header>
        <div id="title-container-top">
            <div id="img-top">
                <img src="../src/public/images/favicon.ico" alt="Logo du portfolio" width="100px">
            </div>
            <h1>Tableau de bord administrateur</h1>
        </div>
    </header>
    <main>
        <div>
            <h2>
                Créer votre compte administrateur
            </h2>
        </div>
        <div>
            <form action="" method="post">
                <div>
                    <label for="email">Votre email</label>
                    <input type="email" name="email" id="email" placeholder="email@admin.com">
                </div>
                <div>
                    <label for="password">Mot de passe</label>
                    <input type="password" name="password" id="password" placeholder="******">
                </div>
            </form>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
